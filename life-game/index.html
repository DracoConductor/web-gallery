<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命游戏 · 增强版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #ccc;
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; user-select: none;
}
.app {
  text-align: center;
  background: #12121a;
  padding: 24px; border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  max-width: 820px;
}
h1 {
  font-size: 20px; color: #4ecdc4; margin-bottom: 4px; letter-spacing: 3px;
}
.subtitle { font-size: 11px; color: #555; margin-bottom: 10px; }
canvas {
  background: #111;
  border-radius: 4px;
  cursor: crosshair;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}
.controls {
  display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap;
}
button {
  padding: 8px 18px; border: 1px solid #2a2a3a; border-radius: 6px;
  background: #1a1a2e; color: #ccc; cursor: pointer; font-size: 13px;
  transition: all 0.15s;
}
button:hover { background: #2a2a4a; }
button.active { background: #e94560; border-color: #e94560; }
.patterns {
  margin: 10px 0 4px;
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
}
.patterns button {
  padding: 5px 12px; font-size: 11px;
  border-color: #1a3a4a; background: #0f2030;
}
.patterns button.place-mode { background: #e94560; border-color: #e94560; animation: pulse 0.8s infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 4px rgba(233,69,96,0.3); }
  50% { box-shadow: 0 0 14px rgba(233,69,96,0.7); }
}
.info {
  margin-top: 6px; font-size: 12px; color: #555;
  display: flex; gap: 20px; justify-content: center;
}
.info span { color: #4ecdc4; }
.legend {
  display: flex; gap: 12px; justify-content: center; align-items: center;
  margin-top: 6px; font-size: 10px; color: #555;
}
.legend-swatch {
  display: inline-block; width: 10px; height: 10px; border-radius: 2px;
  margin-right: 3px; vertical-align: middle;
}
</style>
</head>
<body>
<div class="app">
  <h1>Conway's Game of Life</h1>
  <p class="subtitle">增强版 — 年龄着色 + 经典图案库</p>
  <canvas id="canvas"></canvas>

  <div class="patterns" id="patterns"></div>

  <div class="controls">
    <button class="active" id="btnRun">▶ 运行</button>
    <button id="btnStep">⏭ 单步</button>
    <button id="btnRandom">🎲 随机</button>
    <button id="btnClear">🗑 清空</button>
    <button id="btnFaster">⏩ 加速</button>
  </div>

  <div class="info">
    世代: <span id="gen">0</span>
    存活: <span id="pop">0</span>
    速度: <span id="spd">100ms</span>
  </div>
  <div class="legend">
    <span><span class="legend-swatch" style="background:#4ecdc4"></span>新生</span>
    <span><span class="legend-swatch" style="background:#3a8abf"></span>中年</span>
    <span><span class="legend-swatch" style="background:#6c5ce7"></span>老年</span>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const COLS = 80, ROWS = 50, CELL = 10;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

// grid[y][x] = 0 (dead) or age in generations (1+)
let grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
let running = false;
let gen = 0;
let speed = 100;
let timer = null;
let placeMode = null; // pattern name or null

// ---- Age-to-color mapping ----
function ageColor(age) {
  // newborn (age=1): bright cyan #4ecdc4
  // ages 2-10: cyan → blue transition
  // ages 10-30: blue → purple
  // ages 30+: deep purple, slowly dimming
  const t = Math.min(age, 60) / 60;
  const h = 170 - t * 100;       // hue: cyan(170) → blue(210) → purple(260)
  const s = 0.85 - t * 0.15;     // saturation: slight fade
  const l = 0.55 - t * 0.25;     // lightness: bright → dim
  return `hsl(${h}, ${s * 100}%, ${l * 100}%)`;
}

function drawGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const age = grid[y][x];
      if (age > 0) {
        ctx.fillStyle = ageColor(age);
        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
      }
    }

  // Faint grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
  }
}

function countNeighbors(g, row, col) {
  let n = 0;
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++) {
      if (dy === 0 && dx === 0) continue;
      const y = (row + dy + ROWS) % ROWS;
      const x = (col + dx + COLS) % COLS;
      if (g[y][x] > 0) n++;
    }
  return n;
}

function tick() {
  const next = grid.map(r => [...r]);
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const n = countNeighbors(grid, y, x);
      if (grid[y][x] > 0) {
        // Survive: age increases
        next[y][x] = (n === 2 || n === 3) ? grid[y][x] + 1 : 0;
      } else {
        // Birth: age = 1
        next[y][x] = (n === 3) ? 1 : 0;
      }
    }
  grid = next;
  gen++;
  updateStats();
  drawGrid();
}

function updateStats() {
  document.getElementById('gen').textContent = gen;
  let pop = 0;
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (grid[y][x] > 0) pop++;
  document.getElementById('pop').textContent = pop;
}

function start() {
  if (running) return;
  running = true;
  document.getElementById('btnRun').textContent = '⏸ 暂停';
  document.getElementById('btnRun').classList.add('active');
  timer = setInterval(tick, speed);
}

function pause() {
  running = false;
  document.getElementById('btnRun').textContent = '▶ 运行';
  document.getElementById('btnRun').classList.remove('active');
  clearInterval(timer);
}

function randomize(density = 0.3) {
  pause();
  gen = 0;
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      grid[y][x] = Math.random() < density ? 1 : 0;
  updateStats();
  drawGrid();
}

function clearAll() {
  pause();
  gen = 0;
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  updateStats();
  drawGrid();
}

// ---- Pattern system ----
const PATTERNS = {
  '滑翔机': [[0,1],[1,2],[2,0],[2,1],[2,2]],
  '轻型飞船': [[0,1],[0,4],[1,0],[2,0],[2,4],[3,0],[3,1],[3,2],[3,3]],
  '滑翔机枪': [
    [0,24],[1,22],[1,24],[2,12],[2,13],[2,20],[2,21],[2,34],[2,35],
    [3,11],[3,15],[3,20],[3,21],[3,34],[3,35],[4,0],[4,1],[4,10],[4,16],[4,20],[4,21],
    [5,0],[5,1],[5,10],[5,14],[5,16],[5,17],[5,22],[5,24],[6,10],[6,16],[6,24],
    [7,11],[7,15],[8,12],[8,13]
  ],
  '脉冲星': [
    [0,2],[0,3],[0,4],[0,8],[0,9],[0,10],
    [2,0],[2,5],[2,7],[2,12],
    [3,0],[3,5],[3,7],[3,12],
    [4,0],[4,5],[4,7],[4,12],
    [5,2],[5,3],[5,4],[5,8],[5,9],[5,10],
    [7,2],[7,3],[7,4],[7,8],[7,9],[7,10],
    [8,0],[8,5],[8,7],[8,12],
    [9,0],[9,5],[9,7],[9,12],
    [10,0],[10,5],[10,7],[10,12],
    [12,2],[12,3],[12,4],[12,8],[12,9],[12,10]
  ],
  'R-五格骨牌': [[0,1],[0,2],[1,0],[1,1],[2,1]],
  '橡果': [[0,1],[1,3],[2,0],[2,1],[2,4],[2,5],[2,6]],
  '骰子': [[0,6],[1,0],[1,1],[2,1],[2,5],[2,6],[2,7]],
  '轻型飞船2': [
    [0,2],[0,3],[0,4],[0,5],
    [1,1],[1,5],
    [2,5],
    [3,1],[3,4]
  ],
};

// ---- Place pattern on grid ----
function placePattern(name, cx, cy) {
  const cells = PATTERNS[name];
  if (!cells) return;
  for (const [dx, dy] of cells) {
    const x = cx + dx;
    const y = cy + dy;
    if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
      grid[y][x] = 1;
    }
  }
  updateStats();
  drawGrid();
}

// ---- Build pattern buttons ----
(function buildPatterns() {
  const container = document.getElementById('patterns');
  for (const name of Object.keys(PATTERNS)) {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.title = '点击图案，再点击画布放置';
    btn.onclick = () => {
      // Toggle placement mode
      if (placeMode === name) {
        placeMode = null;
        btn.classList.remove('place-mode');
        canvas.style.cursor = 'crosshair';
      } else {
        // Clear all pattern buttons
        document.querySelectorAll('.patterns button').forEach(b => b.classList.remove('place-mode'));
        placeMode = name;
        btn.classList.add('place-mode');
        canvas.style.cursor = 'cell';
      }
    };
    container.appendChild(btn);
  }
})();

// ---- Canvas interaction ----
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const x = Math.floor(mx / CELL);
  const y = Math.floor(my / CELL);
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

  if (placeMode) {
    placePattern(placeMode, x, y);
    // Exit placement mode
    placeMode = null;
    document.querySelectorAll('.patterns button').forEach(b => b.classList.remove('place-mode'));
    canvas.style.cursor = 'crosshair';
  } else {
    grid[y][x] = grid[y][x] > 0 ? 0 : 1;
    updateStats();
    drawGrid();
  }
});

canvas.addEventListener('mousemove', e => {
  if (placeMode) return;
  if (e.buttons !== 1) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const x = Math.floor(mx / CELL);
  const y = Math.floor(my / CELL);
  if (x >= 0 && x < COLS && y >= 0 && y < ROWS && grid[y][x] === 0) {
    grid[y][x] = 1;
    updateStats();
    drawGrid();
  }
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (placeMode) {
    placeMode = null;
    document.querySelectorAll('.patterns button').forEach(b => b.classList.remove('place-mode'));
    canvas.style.cursor = 'crosshair';
  }
});

// ---- Buttons ----
document.getElementById('btnRun').onclick = () => running ? pause() : start();
document.getElementById('btnStep').onclick = () => { pause(); tick(); };
document.getElementById('btnRandom').onclick = () => randomize();
document.getElementById('btnClear').onclick = () => clearAll();
document.getElementById('btnFaster').onclick = () => {
  speed = speed <= 30 ? 200 : speed <= 60 ? 100 : speed <= 120 ? 60 : 30;
  document.getElementById('spd').textContent = speed + 'ms';
  if (running) { pause(); start(); }
};

// ---- Keyboard ----
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    placeMode = null;
    document.querySelectorAll('.patterns button').forEach(b => b.classList.remove('place-mode'));
    canvas.style.cursor = 'crosshair';
  }
  if (e.key === ' ' && !e.target.closest('button')) {
    e.preventDefault();
    running ? pause() : start();
  }
});

// ---- Start ----
randomize(0.25);
</script>
</body>
</html>
